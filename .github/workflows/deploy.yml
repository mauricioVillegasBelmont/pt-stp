name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # PASO 1: Instalar pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"

      # PASO 2: Configurar Node.js (FORZANDO versión 22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0" # Versión exacta que necesitas
          cache: "pnpm"

      # PASO 3: Verificar versión de Node.js (debug)
      - name: Verify Node.js version
        run: node --version

      # PASO 4: Instalar dependencias
      - name: Install dependencies
        run: pnpm install

      # PASO 5: Build del proyecto
      - name: Build Astro project
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE: ${{ vars.PUBLIC_SITE_BASE }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      # PASO 6: Upload artifact para deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ # La carpeta de salida de Astro

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
