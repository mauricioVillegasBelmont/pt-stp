name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # PASO 1: Instalar pnpm (necesario para el cache)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"

      # PASO 2: Configurar Node.js leyendo la versión del package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json" # ✅ Lee "engines.node" de tu package.json
          cache: "pnpm"

      # PASO 3: Build con Astro (ahora sí hereda la configuración)
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE: ${{ vars.PUBLIC_SITE_BASE }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
